<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script>try{var m=location.search.match(/theme=(light|dark)/);if(m)document.documentElement.setAttribute("data-theme",m[1]);}catch(e){}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MatchCard</title></head>
<body>
<div class="lp-stack">
  <article class="lp-match">
    <div class="lp-match__meta"><span>Fecha 4 · Cancha 2 · 22:00</span><span class="lp-status lp-status--loaded">Cargado</span></div>
    <div class="lp-match__teams">
      <span class="lp-match__team lp-match__team--winner">Ruiz / Ferrari</span><span class="lp-match__score">6 6</span>
      <span class="lp-match__team">Sosa / Medina</span><span class="lp-match__score">4 3</span>
    </div>
    <p class="lp-field__help" style="margin:0">Lo cargó Sosa / Medina. ¿Coincide con lo que jugaron?</p>
    <div class="lp-match__actions"><button class="lp-btn lp-btn--primary" type="button">Confirmar</button><button class="lp-btn lp-btn--secondary" type="button">Rechazar</button></div>
  </article>
  <article class="lp-match">
    <div class="lp-match__meta"><span>Fecha 4 · Cancha 3 · 22:00</span><span class="lp-status lp-status--confirmed">Confirmado</span></div>
    <div class="lp-match__teams">
      <span class="lp-match__team">Paz / Correa</span><span class="lp-match__score">5 6 4</span>
      <span class="lp-match__team lp-match__team--winner">Luna / Vera</span><span class="lp-match__score">7 3 6</span>
    </div>
  </article>
</div>
</body>
</html>
