<!doctype html>
<html>
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script>try{var m=location.search.match(/theme=(light|dark)/);if(m)document.documentElement.setAttribute("data-theme",m[1]);}catch(e){}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Field</title></head>
<body>
<div class="lp-stack">
  <label class="lp-field"><span class="lp-field__label">Nombre y apellido</span><input class="lp-input" value="Lucía Ruiz"></label>
  <label class="lp-field"><span class="lp-field__label">¿En qué categoría juegan?</span>
    <select class="lp-select"><option>Sexta</option><option>Quinta</option><option>Séptima</option></select></label>
  <label class="lp-field lp-field--error"><span class="lp-field__label">WhatsApp</span><input class="lp-input" value="555 12" inputmode="tel">
    <span class="lp-field__error">Revisá el WhatsApp: tiene que tener código de área.</span></label>
</div>
</body>
</html>
